<h1>《机关传说·启蒙篇》技术支持</h1>
<p>《机关传说·启蒙篇》是一款面向 4–6 岁儿童的 iPad 数学启蒙游戏：在森林、海洋、沙漠、火山四个世界的 80 个机关关卡里，学习数数、比较大小、排序和加减法。</p>
<p>完全离线运行，无广告、无内购、不收集任何个人信息。</p>
<h2>常见问题</h2>
<p><b>如何解锁下一个世界？</b> 完成当前世界的最后一关即可解锁下一个世界。</p>
<p><b>游戏进度保存在哪里？</b> 只保存在本设备上。删除应用会清除进度。</p>
